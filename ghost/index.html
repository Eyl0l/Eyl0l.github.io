<html>
<head>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    var ghosts = 10;
    var coords;

    function toggle(t, s) {
      document.querySelector('a-scene').setAttribute('fog', 'type: linear; far: 100');
      document.getElementById('txt').setAttribute('value', t);
      
      setTimeout(function () {
        document.getElementById('cam1').setAttribute('active', 'false');
        document.getElementById('cam2').setAttribute('active', 'true');
      }, 2000);

      var playerEl = document.getElementById('player');
      playerEl.setAttribute('sound', 'src: ' + s + '; autoplay: true');
    }

    AFRAME.registerComponent('ghosting', {
      init: function () {
        this.el.addEventListener('mouseenter', function () {
          document.getElementById('shot').setAttribute('sound', 'src: #gun; autoplay: true');
        });

        this.el.addEventListener('mouseleave', function (evt) {
          evt.target.parentNode.removeChild(evt.target);
          ghosts--;
          if (ghosts <= 0) toggle('WELL DONE', '#scream');
        });
      }
    });
    function spawnGhost() {
      var scene = document.querySelector('a-scene');

      var ghost = document.createElement('a-entity');
      ghost.setAttribute('gltf-model', '#ghost');
      var x = Math.random() * 60 - 30;
      var z = Math.random() * -60;
      var y = Math.random() * 10 + 2;
      ghost.setAttribute('position', x + " " + y + " " + z);
      ghost.setAttribute('scale', '2 2 2');
      ghost.setAttribute('ghosting', '');
      scene.appendChild(ghost);
    }

    window.onload = () => {
      for (let i = 0; i < ghosts; i++) {
        spawnGhost();
      }
    };
  </script>
</head>
<body>
  <a-scene fog="type: linear; near: 10; far: 200">
    <a-assets>
      <a-asset-item id="ghost" src="ghost.gltf"></a-asset-item>
      <a-asset-item id="craft" src="spacecraft.glb"></a-asset-item>
      <img id="b1" src="b1.png">
      <img id="stars" src="eso0932a.jpg">
      <audio id="gun" src="mixkit-short-laser-gun-shot-1670.wav"></audio>
      <audio id="scream" src="mixkit-battle-man-scream-2175.wav"></audio>
    </a-assets>
    <a-sky src="#stars"></a-sky>
    <a-box color="#333" width="100" height="0.5" depth="100" position="0 0 0"></a-box>
    <a-plane src="#b1" position="-20 10 -30" width="10" height="20"></a-plane>
    <a-plane src="#b1" position="20 10 -40" width="10" height="20"></a-plane>
    <a-plane src="#b1" position="0 10 -50" width="10" height="20"></a-plane>
    <a-entity id="rig" position="0 2 10">
      <a-camera id="cam1" wasd-controls look-controls>
        <a-cursor color="lime"></a-cursor>
        <a-entity id="shot"></a-entity>
        <a-entity id="player"></a-entity>
      </a-camera>
    </a-entity>
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light type="directional" intensity="1" position="1 1 1"></a-light>
    <a-entity id="spacecraft" gltf-model="#craft" position="0 20 -40" scale="5 5 5">
      <a-camera id="cam2" active="false">
        <a-entity id="txt"
          text="value: ; color: red"
          position="0 0 -2"></a-entity>
      </a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
